<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>US Accidents Report – Slides</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/5.1.0/reset.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/5.1.0/reveal.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/5.1.0/theme/black.min.css">
  <style>
    :root { --accent: #b6ff00; }
    html, body, .reveal, .reveal-viewport { background: #000; }
    .reveal .slides section { padding: 0; height: 100%; }
    .reveal .slides section img {
      display: block;
      width: 100%;
      height: 100%;
      max-width: none;
      max-height: none;
      margin: 0;
      object-fit: contain;
    }
    .reveal .progress { color: var(--accent); }
    .reveal .controls { color: var(--accent); }
    .reveal .slide-number {
      background: rgba(0, 0, 0, 0.6);
      color: #eaeaea;
      font-size: 14px;
      border-radius: 6px;
      right: 12px;
      bottom: 12px;
    }
  </style>
</head>
<body>
  <div class="reveal">
    <div class="slides">
      <section id="home"><img data-src="images/1.png" alt="Home / Cover"></section>
      <section id="toc"><img data-src="images/2.png" alt="Table of Contents"></section>
      <section id="tools"><img data-src="images/3.png" alt="Tools &amp; Equipment"></section>
      <section id="about"><img data-src="images/4.png" alt="About Dataset"></section>
      <section id="ch2"><img data-src="images/5.png" alt="Chapter 2 – Intro to Probability &amp; Statistics"></section>
      <section id="ch3"><img data-src="images/6.png" alt="Chapter 3 – Random Variable"></section>
      <section id="ch4"><img data-src="images/7.png" alt="Chapter 4 – Discrete Probability Distribution"></section>
      <section id="ch5"><img data-src="images/8.png" alt="Chapter 5 – Continuous Probability Distribution"></section>
      <section id="ch6"><img data-src="images/9.png" alt="Chapter 6 – Sampling distribution"></section>
      <section id="ch7"><img data-src="images/10.png" alt="Chapter 7 – Estimation"></section>
      <section id="ch8"><img data-src="images/11.png" alt="Chapter 8 – Test of Hypotheses"></section>
      <section id="members"><img data-src="images/12.png" alt="Members"></section>
      <section id="thanks"><img data-src="images/13.png" alt="Thank You"></section>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/5.1.0/reveal.min.js"></script>
  <script>
    // Same presentation settings as the CMCC 2025 Quarto deck
    Reveal.initialize({
      width: 1920,
      height: 1080,
      margin: 0.04,
      center: true,
      hash: true,
      controls: true,
      controlsLayout: 'edges',
      progress: true,
      slideNumber: 'c/t',
      transition: 'fade',
      backgroundTransition: 'none',
      navigationMode: 'linear',
      viewDistance: 3
    });
  </script>
</body>
</html>
