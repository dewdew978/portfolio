name: Auto-Sync Strava Data Pipeline

on:
  repository_dispatch:
    types: [strava_new_activity]
  schedule:
    # Auto-sync live runs every 2 hours automatically (100% Free GitHub Actions)
    - cron: '0 */2 * * *'
  workflow_dispatch: # Manual trigger from GitHub Actions tab

jobs:
  sync-strava:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Strava Sync Script
        run: node scripts/sync-strava.js

      - name: Commit & Push updated Strava activities
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add public/data/strava-activities.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(strava): auto-sync live athletic activities [skip ci]" && git push)
